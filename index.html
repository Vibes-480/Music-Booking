<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music Room</title>
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f3f2f7; --fg:#1d1b26; --muted:#6a6779; --card:#fff; --line:#e1dfea;
  --free:#1f9d5b; --busy:#d2433b; --busy-soft:#fbe6e4; --warn:#c77a06; --warn-soft:#fcf0dc;
  --accent:#5b4bdb; --accent-soft:#ece9fd; --on-accent:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14131a; --fg:#ecebf3; --muted:#a19eb2; --card:#201e29; --line:#33303f;
  --free:#2f9e62; --busy:#d4544b; --busy-soft:#3a1d1b; --warn:#f0a43a; --warn-soft:#3a2a12;
  --accent:#8d80ff; --accent-soft:#2b2650; --on-accent:#14131a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-size:15px;line-height:1.45;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:6px 2px 0;display:flex;justify-content:space-between;align-items:center}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 8px;font-weight:600}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
button.danger{color:var(--busy)}
button.link{border:0;background:none;color:var(--accent);padding:4px 6px}
button.link.danger{color:var(--busy)}
.grid .fav{grid-column:span 2}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.banner{border-radius:20px;padding:16px 18px;color:#fff;background:var(--free)}
.banner.busy{background:var(--busy)}
.banner b{display:block;font-size:26px;line-height:1.15}
.banner span{opacity:.92;font-size:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.row.now{background:var(--accent-soft)}
.row.past{opacity:.5}
.empty{padding:14px;color:var(--muted)}
.me{color:var(--accent);font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.unknown{background:var(--warn-soft);color:var(--warn)}
.pill.noname{background:var(--busy-soft);color:var(--busy)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid .wide{grid-column:1/-1}
.sub{color:var(--muted);font-size:13px;margin:0 2px}
.confirm{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.confirm div{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.confirm p{margin:0;font-size:18px;font-weight:700}
.confirm .btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;border-radius:0;background:none;padding:14px 0;color:var(--muted)}
nav button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;border-top:0}
th:first-child,td:first-child{text-align:left}
.chart svg{width:100%;height:auto;display:block}
.form{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:center}
.inline > *{flex:1}
@media (prefers-reduced-motion:no-preference){.confirm{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden>
  <button data-tab="now">Now</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="people">People</button>
</nav>
<script src="app.js"></script>
</body>
</html>
